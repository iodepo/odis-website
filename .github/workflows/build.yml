name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress production deploy finish; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Only runs once the repo is public and Pages is enabled. While private
      # on the Free plan there is no Pages site to configure, and this action
      # hard-fails with "Get Pages site failed" if it cannot find one.
      - name: Configure Pages
        id: pages
        if: github.event.repository.private == false
        uses: actions/configure-pages@v5

      - name: Build site
        # base_path is empty for a custom apex domain, and also empty when the
        # step above is skipped, so this is correct in both states.
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Check internal links
        # Not html-proofer: 5.2.2 reports "0 internal links" and exits 0 even on
        # a file with a deliberately broken link.
        run: python3 script/check_links.py _site


      # Uploaded even while private: it is a downloadable preview of the built
      # site, and deploy-pages needs it once Pages is turned on.
      - uses: actions/upload-pages-artifact@v3

  deploy:
    # Only deploy from main, never from a pull request.
    #
    # GitHub Pages is not available for private repositories on the Free plan,
    # so deployment is skipped while this repo is private. Flipping it to
    # public enables it automatically - no workflow change needed. Build and
    # link checks still run either way, so the workflow stays green meanwhile.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
