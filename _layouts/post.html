---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    {%- if page.author %} <span aria-hidden="true">&bull;</span> {{ page.author }}{% endif %}
  </p>

  {{ content }}
</article>

<hr>
<p><a href="{{ '/news/' | relative_url }}">&larr; All news</a></p>
